# ==============================================================================
# ElevateIQ Meet — Render Infrastructure Blueprint (render.yaml)
# ==============================================================================
# Deploy both Backend (Web Service) and Frontend (Static Site) simultaneously.

services:
  # ── 1. Backend Web Service (Flask + SocketIO + Neon PostgreSQL) ───────────────
  - type: web
    name: elevateiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 50 -w 1 wsgi:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon connection string
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: LOG_TO_FILE
        value: "false"

  # ── 2. Frontend Static Site (React 19 + Vite + Tailwind CSS) ───────────────────
  - type: web
    name: elevateiq-meet
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://elevateiq-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        sync: false # e.g. https://elevateiq-backend.onrender.com
